server {
    listen 80;
    server_name _;

    # 上传视频上限与 Flask 的 MAX_CONTENT_LENGTH 保持一致
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:5820;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTPS 二选一：
# 1) 华为云 SSL 证书：在控制台申请后，把证书配置到 443 server 块；
# 2) Let's Encrypt：sudo certbot --nginx -d your.domain
#
# 启用 HTTPS 后，务必在 /opt/xide/.env 设置 ZX_COOKIE_SECURE=1。