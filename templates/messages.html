{% extends 'base.html' %}
{% from 'base.html' import icon %}
{% block title %}消息{% endblock %}
{% block page_title %}消息 · 学习接力{% endblock %}
{% block eyebrow %}结束/到期后的推送都在这里{% endblock %}
{% block content %}
<div class="stack">
  <div class="row between wrap">
    <div class="row"><span class="badge amber">未读 <b id="unreadCount">—</b></span><span class="small muted">接棒、预约、系统通知</span></div>
    <button class="btn ghost sm" id="readAll">全部标为已读</button>
  </div>
  <section class="card">
    <div class="card-body" id="messageList"><div class="skeleton" style="height:80px"></div></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
  const kindMap = { relay: ['amber', '接棒'], booking: ['blue', '预约'], session: ['gray', '场次'], system: ['gray', '系统'] };
  async function load() {
    try {
      const r = await ZX.api('/api/messages');
      const list = r.messages || [];
      document.getElementById('unreadCount').textContent = list.filter(x => !x.read).length;
      const box = document.getElementById('messageList');
      if (!list.length) { box.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><b>还没有消息</b><span>预约成功、学习结束、接棒推送都会在这里。</span></div>'; return; }
      box.innerHTML = list.map(m => {
        const k = kindMap[m.kind] || ['gray', m.kind];
        return '<div class="list-item" style="' + (m.read ? '' : 'background:#fbfcfe;border-radius:10px;padding-left:8px;padding-right:8px') + '"><div class="thumb" style="background:#f4f6f9">' + (m.kind === 'relay' ? '🎬' : m.kind === 'booking' ? '🪑' : '🔔') + '</div><div class="grow"><div class="row between"><b>' + ZX.escapeHtml(m.title) + '</b><span class="badge ' + k[0] + '">' + k[1] + '</span></div><small>' + ZX.escapeHtml(m.body || '') + '</small><div class="small muted" style="margin-top:2px">' + ZX.fmtDate(m.created_at) + (m.read ? '' : ' · 未读') + '</div></div>' + (m.kind === 'relay' ? '<a class="btn ghost sm" href="/learn">去看</a>' : '') + '</div>';
      }).join('');
    } catch (e) { ZX.toast(e.message, 'err'); }
  }
  document.getElementById('readAll').addEventListener('click', async () => {
    try { await ZX.api('/api/messages/read', { method: 'POST', body: {} }); ZX.toast('已全部标为已读'); load(); } catch (e) { ZX.toast(e.message, 'err'); }
  });
  load();
</script>
{% endblock %}
